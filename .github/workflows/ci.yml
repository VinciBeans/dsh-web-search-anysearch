name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 多版本兼容矩阵：支持范围自 dsh-v0.1.5-alpha.1 起，故对区间内**每个已发布 tag**
    # 各验一遍准入断言 + typecheck + build + test：0.1.5 线全部五个（alpha.1 /
    # alpha.2 / rc.1 / rc.2 / rc.3）、dsh-v0.1.6-alpha.2、0.1.7 线全部四个
    # （alpha.1 / alpha.2 / rc.1 / rc.2）与 dsh-v0.2.0-rc.2，共 11 条腿。
    # 不入矩阵的：0.1.2 / 0.1.3 线（已不在支持范围；dsh 从未发布 0.1.4）、
    # 0.1.6-alpha.1（在范围下限之前）、0.2.0-rc.1（peer 范围刻意拒绝的预发布）。
    # 0.1.6 重建了 Plugins 页面，0.1.7 换成 row 页面并把设置节改成 volatile 配置
    # 引用，两个 tag 各自验证客户端与服务端的形状选择。准入闸门自 0.1.7-rc.1 起
    # 存在（peer 范围必须覆盖运行时版本，否则 bundle 与行都会被拒），所以
    # 0.1.7-rc.1 / rc.2 与 0.2.0-rc.2 跑的是真实断言，更早的腿走「无闸门可断言」
    # 的跳过分支。0.2.0-rc.1 起官方搜索还开始支持账户令牌认证。
    strategy:
      fail-fast: false
      matrix:
        harness:
          - tag: dsh-v0.1.5-alpha.1
            pin: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
          - tag: dsh-v0.1.5-alpha.2
            pin: b2e3b2a0125854567a4a5fcba75782e42fe84901
          - tag: dsh-v0.1.5-rc.1
            pin: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
          - tag: dsh-v0.1.5-rc.2
            pin: fb2c4b9e698e30edb738bca4cf0618587db7d203
          - tag: dsh-v0.1.5-rc.3
            pin: a4c74a91e06b00fe0b0937bde982170c526cc842
          - tag: dsh-v0.1.6-alpha.2
            pin: ddefc45fbc7f8e46dd73185e68295696d1297887
          - tag: dsh-v0.1.7-alpha.1
            pin: c36a83ff6bb95e3f82cf79f9be7c724270a8aa61
          - tag: dsh-v0.1.7-alpha.2
            pin: 00102833dfaee1da9f48a3a8eae9d34005a75218
          - tag: dsh-v0.1.7-rc.1
            pin: 46a7f68b0922371ce7144b668b90e377d8e799f4
          - tag: dsh-v0.1.7-rc.2
            pin: 477b4f420553e8a52c2fbccc464d7561b239c443
          - tag: dsh-v0.2.0-rc.2
            pin: 639ed015397290b3745d163aafe02ffee4aa3f84
    steps:
      - uses: actions/checkout@v4

      # 宿主类型依赖用 file:../../deepseek-harness/... 指向下方检出（两个上级目录，
      # 即 $RUNNER_WORKSPACE），必须携带已构建的 lib/types 产物；tsconfig 的
      # paths 把 @deepseek-ai/cordis 固定到本包安装的拷贝，因此类型增广的模块
      # 身份不依赖 harness 的 vendor 布局。
      - name: Checkout DeepSeek-Harness (${{ matrix.harness.tag }})
        run: |
          git clone --depth 1 --branch ${{ matrix.harness.tag }} \
            https://github.com/deepseek-ai/DeepSeek-Harness.git ../../deepseek-harness
          # Pin the tag to the exact release commit; fail loud if it moved.
          test "$(git -C ../../deepseek-harness rev-parse HEAD)" = "${{ matrix.harness.pin }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build harness lib (host type artifacts)
        working-directory: ../../deepseek-harness
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The admission gate reads these ranges before importing the plugin, so a
      # range that misses the leg's runtime is a load failure, not a warning.
      - name: Assert the harness admits this plugin
        run: npm run compat

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke check the host bundle
        run: |
          node --input-type=module -e "
            const m = await import('./lib/index.js');
            if ('default' in m) throw new Error('host bundle must not have a default export');
            for (const k of ['name', 'Config', 'apply', 'ANYSEARCH_PROVIDER_ID', 'configValueOf']) if (!(k in m)) throw new Error('missing export ' + k);
            // The parsed config shape depends on the schema builder: a volatile
            // field resolves to a reference (schemastery >= 3.18.3, which dsh
            // 0.1.7 ships), a plain one to the value. Read both through the
            // documented reader, exactly as apply does.
            const cfg = m.Config({});
            if (m.configValueOf(cfg.apiKeyEnv) !== 'ANYSEARCH_API_KEY') throw new Error('schema defaults broken');
            if (m.configValueOf(cfg.searchProvider) !== 'anysearch') throw new Error('switch default broken');
            const resolved = m.resolveConfig({ searchProvider: { get: () => 'deepseek-official' } });
            if (resolved.searchProvider !== 'deepseek-official') throw new Error('reference-shaped config broken');
            console.log('host smoke ok');
          "
